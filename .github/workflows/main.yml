name: Build Angular
on: 
 push: 
   branches: [main]
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses:  actions/checkout@v7.0.1
      - name: setup node environent
        uses: actions/setup-node@v7.1.0
